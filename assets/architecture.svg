<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="520" rx="18" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#1a1a2e" font-size="22" font-weight="bold">ChatSolveAI — System Architecture</text>

  <!-- ===== NODE: Customer Query ===== -->
  <rect x="40" y="80" width="170" height="70" rx="14" fill="#f0f4ff" stroke="#58a6ff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="125" y="112" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Customer</text>
  <text x="125" y="130" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Query</text>

  <!-- Arrow 1: Query → Embedding -->
  <line x1="210" y1="115" x2="290" y2="115" stroke="#b0b8c1" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="288,109 300,115 288,121" fill="#6e7781"/>
  <!-- Animated dot on arrow 1 -->
  <circle r="4" fill="#58a6ff">
    <animateMotion dur="2s" repeatCount="indefinite" path="M210,115 L290,115" begin="0s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== NODE: OpenAI Embedding ===== -->
  <rect x="300" y="80" width="190" height="70" rx="14" fill="#fff5f0" stroke="#f78166" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <text x="395" y="108" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">OpenAI Embeddings</text>
  <text x="395" y="128" text-anchor="middle" fill="#57606a" font-size="11">text-embedding-3-small</text>

  <!-- Arrow 2: Embedding → Similarity -->
  <line x1="490" y1="115" x2="570" y2="115" stroke="#b0b8c1" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="568,109 580,115 568,121" fill="#6e7781"/>
  <circle r="4" fill="#f78166">
    <animateMotion dur="2s" repeatCount="indefinite" path="M490,115 L570,115" begin="0.6s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- ===== NODE: Cosine Similarity ===== -->
  <rect x="580" y="80" width="190" height="70" rx="14" fill="#f5f0ff" stroke="#d2a8ff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <text x="675" y="108" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold">Cosine Similarity</text>
  <text x="675" y="128" text-anchor="middle" fill="#57606a" font-size="11">Semantic Search</text>

  <!-- ===== Knowledge Base (feeds into Similarity) ===== -->
  <rect x="580" y="200" width="190" height="60" rx="12" fill="#f0fff4" stroke="#3fb950" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="675" y="228" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Knowledge Base</text>
  <text x="675" y="244" text-anchor="middle" fill="#57606a" font-size="10">knowledge_base.csv</text>
  <!-- Arrow: KB → Similarity -->
  <line x1="675" y1="200" x2="675" y2="155" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="669,157 675,150 681,157" fill="#3fb950"/>

  <!-- ===== Decision Diamond ===== -->
  <polygon points="450,260 530,310 450,360 370,310" fill="#fffbf0" stroke="#e3b341" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </polygon>
  <text x="450" y="306" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">Match</text>
  <text x="450" y="322" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">Found?</text>

  <!-- Arrow: Similarity → Decision -->
  <path d="M675,150 L675,175 Q675,185 665,185 L540,185 Q530,185 525,195 L460,256" stroke="#b0b8c1" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <polygon points="455,252 460,264 465,254" fill="#6e7781"/>
  <circle r="4" fill="#d2a8ff">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M675,150 L675,180 L530,180 L460,256" begin="1.2s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- ===== YES branch: Predefined Response ===== -->
  <rect x="120" y="280" width="190" height="60" rx="12" fill="#f0fff4" stroke="#3fb950" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2s"/>
  </rect>
  <text x="215" y="306" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Predefined Response</text>
  <text x="215" y="324" text-anchor="middle" fill="#57606a" font-size="10">predefined_responses.json</text>
  <!-- Arrow: Decision → Yes -->
  <line x1="370" y1="310" x2="315" y2="310" stroke="#b0b8c1" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="317,304 305,310 317,316" fill="#3fb950"/>
  <text x="345" y="300" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">YES</text>

  <!-- ===== NO branch: GPT Generation ===== -->
  <rect x="600" y="280" width="190" height="60" rx="12" fill="#fff0f0" stroke="#f47067" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2s"/>
  </rect>
  <text x="695" y="306" text-anchor="middle" fill="#f47067" font-size="13" font-weight="bold">GPT-3.5-turbo</text>
  <text x="695" y="324" text-anchor="middle" fill="#57606a" font-size="10">Generate New Response</text>
  <!-- Arrow: Decision → No -->
  <line x1="530" y1="310" x2="595" y2="310" stroke="#b0b8c1" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="593,304 605,310 593,316" fill="#f47067"/>
  <text x="562" y="300" text-anchor="middle" fill="#f47067" font-size="11" font-weight="bold">NO</text>

  <!-- ===== Converge arrows to Log ===== -->
  <!-- Left branch down -->
  <line x1="215" y1="340" x2="215" y2="410" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="215" y1="410" x2="385" y2="410" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Right branch down -->
  <line x1="695" y1="340" x2="695" y2="410" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="695" y1="410" x2="525" y2="410" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ===== NODE: Log Interaction ===== -->
  <rect x="385" y="385" width="140" height="50" rx="12" fill="#f0f4ff" stroke="#79c0ff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2.5s"/>
  </rect>
  <text x="455" y="408" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="bold">Log Interaction</text>
  <text x="455" y="424" text-anchor="middle" fill="#57606a" font-size="10">JSON Output</text>

  <!-- Arrow down to final output -->
  <line x1="455" y1="435" x2="455" y2="465" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="449,463 455,473 461,463" fill="#6e7781"/>

  <!-- ===== Final: Response to Customer ===== -->
  <rect x="365" y="470" width="180" height="40" rx="10" fill="#f0f4ff" stroke="#58a6ff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="3s"/>
  </rect>
  <text x="455" y="496" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Response to Customer</text>

</svg>
